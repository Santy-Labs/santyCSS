name: Publish to NPM

# Publishing to npm is what makes the jsDelivr / unpkg CDN links work, and the
# site pages load the framework from there. So publish whenever main carries a
# package.json version that npm doesn't have yet — no manual release needed.
on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check whether this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "santycss@$VERSION" version >/dev/null 2>&1; then
            echo "santycss@$VERSION is already published — nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CSS
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Run test suite
        if: steps.check.outputs.publish == 'true'
        run: node test/run-tests.js

      - name: Publish to NPM
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Warm the jsDelivr cache
        if: steps.check.outputs.publish == 'true'
        run: |
          V=${{ steps.check.outputs.version }}
          for f in dist/santy.css dist/santy.min.css dist/santy-variants.css dist/santy-components.css \
                   dist/santy-animations.css dist/santy-icons.css dist/santy-scroll.js santy-jit.js; do
            curl -fsS -o /dev/null "https://cdn.jsdelivr.net/npm/santycss@$V/$f" || echo "warn: $f not yet on CDN"
          done
          curl -fsS -o /dev/null "https://purge.jsdelivr.net/npm/santycss@2/dist/santy.min.css" || true
